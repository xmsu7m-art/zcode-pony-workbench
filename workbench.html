<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCode 小马工作台 · 实时</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 24px 16px; background: light-dark(#ececf0, #0e0e11);
    font-family: -apple-system, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; min-height: calc(100vh - 48px); align-items: flex-start;
  }
  #zw {
    --zw-bg: light-dark(#f6f6f8, #141417);
    --zw-rail: light-dark(#ececef, #1b1b20);
    --zw-panel: light-dark(#ffffff, #1e1e24);
    --zw-panel-2: light-dark(#f3f3f6, #232329);
    --zw-border: light-dark(rgba(20,20,30,.10), rgba(255,255,255,.09));
    --zw-text: light-dark(#1c1c21, #ececf1);
    --zw-dim: light-dark(#6b6b76, #9a9aa6);
    --zw-accent: light-dark(#6d5ae6, #8a7bff);
    --zw-accent-soft: light-dark(rgba(109,90,230,.12), rgba(138,123,255,.16));
    --zw-ok: light-dark(#1f9d61, #3ecf8e);
    --zw-warn: light-dark(#c07a12, #f0b429);
    --zw-bad: light-dark(#d64545, #ff6b6b);
    --zw-wall: light-dark(#f1eefb, #262631);
    --zw-floor-a: light-dark(#e9e6f7, #232330);
    --zw-floor-b: light-dark(#ded9f2, #1f1f2b);
    --zw-wood: light-dark(#cdb08a, #8a6f52);
    --zw-wood-dark: light-dark(#b3926c, #755c42);
    --zw-screen-off: light-dark(#d8d5e6, #2c2c3a);
    --zw-chair: light-dark(#8f8fa0, #4a4a5c);
    color: var(--zw-text); background: var(--zw-bg);
    border: 1px solid var(--zw-border); border-radius: 14px; overflow: hidden;
    display: flex; width: 100%; max-width: 1240px; min-height: 640px;
    box-shadow: 0 18px 60px rgba(0,0,0,.18);
  }
  #zw * { box-sizing: border-box; }
  #zw .zw-rail { width: 52px; background: var(--zw-rail); border-right: 1px solid var(--zw-border); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 0; }
  #zw .zw-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--zw-accent); color: #fff; font-weight: 500; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  #zw .zw-ricon { color: var(--zw-dim); }
  #zw .zw-spacer { flex: 1; }
  #zw .zw-chat { flex: 1 1 340px; min-width: 280px; border-right: 1px solid var(--zw-border); display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }
  #zw .zw-chat-title { font-size: 12px; color: var(--zw-dim); letter-spacing: .04em; }
  #zw .zw-msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.55; }
  #zw .zw-msg.u { align-self: flex-end; background: var(--zw-accent); color: #fff; border-bottom-right-radius: 4px; }
  #zw .zw-msg.a { align-self: flex-start; background: var(--zw-panel-2); border-bottom-left-radius: 4px; }
  #zw .zw-chat-input { margin-top: auto; border: 1px solid var(--zw-border); background: var(--zw-panel); border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--zw-dim); display: flex; justify-content: space-between; }
  #zw .zw-side { flex: 1 1 auto; min-width: 320px; background: var(--zw-panel); display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }
  #zw .zw-side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #zw .zw-side-title { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  #zw .zw-chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--zw-panel-2); color: var(--zw-dim); display: inline-flex; align-items: center; gap: 5px; }
  #zw .zw-chip .zw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--zw-ok); }
  #zw .zw-chip.live .zw-dot { animation: zw-pulse 1.6s infinite; }
  @keyframes zw-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #zw .zw-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  #zw .zw-stat { flex: 1 1 110px; background: var(--zw-panel-2); border-radius: 10px; padding: 8px 10px; }
  #zw .zw-stat b { display: block; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #zw .zw-stat span { font-size: 11px; color: var(--zw-dim); }
    #zw .zw-wallet { cursor: pointer; background: var(--zw-panel-2); border-radius: 9px; padding: 6px 10px 7px; }
    #zw .zw-wallet .zw-wbar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--zw-accent) 16%, transparent); overflow: hidden; margin-bottom: 4px; }
    #zw .zw-wallet .zw-wbar i { display: block; height: 100%; border-radius: 3px; background: var(--zw-accent); transition: width .6s; }
    #zw .zw-wallet span { font-size: 11px; color: var(--zw-dim); font-variant-numeric: tabular-nums; }
  #zw .zw-scene { position: relative; border: 1px solid var(--zw-border); border-radius: 12px; overflow: hidden; background: var(--zw-wall); }
  #zw canvas { display: block; width: 100%; height: 520px; cursor: pointer; }
  #zw .zw-tag { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--zw-text); background: var(--zw-panel); border: 1px solid var(--zw-border); border-radius: 7px; padding: 1px 7px; white-space: nowrap; pointer-events: none; }
  #zw .zw-tag .zw-sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  #zw .zw-bubble { position: absolute; transform: translateX(-50%); max-width: 200px; font-size: 11px; line-height: 1.4; background: var(--zw-panel); border: 1px solid var(--zw-border); color: var(--zw-text); border-radius: 9px; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.10); }
  #zw .zw-bubble::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; border-right: 1px solid var(--zw-border); border-bottom: 1px solid var(--zw-border); transform: translateX(-50%) rotate(45deg); }
  #zw .zw-detail { font-size: 12px; color: var(--zw-dim); background: var(--zw-panel-2); border-radius: 9px; padding: 7px 10px; min-height: 32px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #zw .zw-detail b { color: var(--zw-text); font-weight: 500; }
  #zw .zw-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--zw-border); }
  #zw .zw-tabs button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--zw-dim); padding: 6px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #zw .zw-tabs button[aria-selected="true"] { color: var(--zw-text); border-bottom-color: var(--zw-accent); }
  #zw .zw-log { display: flex; flex-direction: column; gap: 6px; min-height: 170px; }
  #zw .zw-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  #zw .zw-row .zw-t { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--zw-dim); flex: none; width: 60px; }
  #zw .zw-row .zw-agent { flex: none; width: 74px; color: var(--zw-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #zw .zw-row .zw-badge { flex: none; font-size: 11px; padding: 0 6px; border-radius: 5px; }
  #zw .zw-row .zw-badge.ok { background: var(--zw-accent-soft); color: var(--zw-accent); }
  #zw .zw-row .zw-badge.warn { background: color-mix(in srgb, var(--zw-warn) 16%, transparent); color: var(--zw-warn); }
  #zw .zw-row .zw-badge.bad { background: color-mix(in srgb, var(--zw-bad) 15%, transparent); color: var(--zw-bad); }
  #zw .zw-row .zw-badge.run { background: color-mix(in srgb, var(--zw-ok) 16%, transparent); color: var(--zw-ok); }
  #zw .zw-row .zw-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #zw .zw-more { font-size: 11px; color: var(--zw-dim); }
  #zw .zw-art { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--zw-border); border-radius: 10px; font-size: 12px; }
  #zw .zw-art .zw-sub { color: var(--zw-dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  #zw .zw-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #zw .zw-foot .zw-hint { font-size: 11px; color: var(--zw-dim); }
  #zw .zw-btn { border: 1px solid var(--zw-border); background: var(--zw-panel); color: var(--zw-text); font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 9px; cursor: pointer; }
  #zw .zw-btn.primary { background: var(--zw-accent); border-color: transparent; color: #fff; }
  @media (max-width: 900px) { #zw { flex-direction: column; } #zw .zw-rail { display: none; } #zw .zw-chat { border-right: 0; border-bottom: 1px solid var(--zw-border); } }
</style>
</head>
<body>
<div id="zw" aria-label="ZCode 小马工作台(实时)">
  <nav class="zw-rail" aria-hidden="true">
    <div class="zw-logo">Z</div>
    <div class="zw-ricon">▣</div>
    <div class="zw-ricon">▤</div>
    <div class="zw-spacer"></div>
    <div class="zw-ricon">⚙</div>
  </nav>
  
  <aside class="zw-side" aria-label="小马工作台">
    <div class="zw-side-head">
      <div class="zw-side-title">小马工作台<span class="zw-chip" id="zw-live"><span class="zw-dot"></span><span id="zw-live-txt">连接中…</span></span></div>
      <button type="button" class="zw-btn" id="zw-demo">播放演示</button>
    </div>
    <div class="zw-stats" aria-label="工作台状态">
      <div class="zw-stat"><b id="zw-st-active">0/5</b><span>在岗小马</span></div>
    </div>
    <div class="zw-scene" id="zw-scene">
      <canvas id="zw-canvas" role="img" aria-label="虚拟办公室动画:五个工位上的小马代理实时反映 ZCode 会话中的 agent 状态。"></canvas>
    </div>
    <div class="zw-detail" id="zw-detail" aria-live="polite">点击任意小马查看分工与最近动作。</div>
    <div class="zw-tabs" role="tablist" aria-label="工作台视图">
      <button type="button" role="tab" id="zw-tab-log" aria-selected="true" aria-controls="zw-panel-log">工作日志</button>
      <button type="button" role="tab" id="zw-tab-art" aria-selected="false" aria-controls="zw-panel-art">产出物</button>
    </div>
    <div id="zw-panel-log" role="tabpanel" aria-labelledby="zw-tab-log" class="zw-log"></div>
    <div id="zw-panel-art" role="tabpanel" aria-labelledby="zw-tab-art" hidden style="display:flex;flex-direction:column;gap:6px;min-height:170px;">
      <div class="zw-art">events.jsonl<span class="zw-sub">hooks 原始事件流 · 追加写入</span></div>
      <div class="zw-art">state.json<span class="zw-sub">每会话 token 累计游标</span></div>
      <div class="zw-art">hook.py / server.py<span class="zw-sub">采集器 + 本地服务 · 可自查</span></div>
    </div>
    <div class="zw-foot">
      <span class="zw-hint">数据源:hooks 事件流 + 会话转录增量(计费口径不含缓存读取)。点余额条可设额度。</span>
    </div>
  </aside>
</div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("zw");
  var canvas = document.getElementById("zw-canvas");
  var scene = document.getElementById("zw-scene");
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var ROSTER = [
    { key: "main",    name: "ZCode",    role: "主编排 · 会话主代理",      scarf: "#8a7bff" },
    { key: "explore", name: "Explore",  role: "只读检索 · 代码与文件扫描", scarf: "#5aa2ff" },
    { key: "general", name: "General",  role: "通用子代理 · 多步研究任务", scarf: "#3ecf8e" },
    { key: "flow",    name: "Workflow", role: "动态工作流 · 子代理并行",   scarf: "#ff8fa3" },
    { key: "judge",   name: "Judge",    role: "视觉验收 · 交付物评审",     scarf: "#f0b429" }
  ];
  var SCARFS = ["#8a7bff", "#5aa2ff", "#3ecf8e", "#ff8fa3", "#f0b429", "#4dd0c4", "#ef9a6d"];

  var C = {};
  var probe = document.createElement("div");
  probe.style.display = "none";
  document.body.appendChild(probe);
  function resolveColors() {
    var names = ["--zw-wall","--zw-floor-a","--zw-floor-b","--zw-wood","--zw-wood-dark","--zw-screen-off",
      "--zw-chair","--zw-text","--zw-dim","--zw-border","--zw-panel","--zw-accent","--zw-ok","--zw-warn","--zw-bad"];
    names.forEach(function (n) {
      probe.style.color = "";
      probe.style.color = "var(" + n + ")";
      C[n] = getComputedStyle(probe).color || "#888";
    });
    C.wall = C["--zw-wall"]; C.floorA = C["--zw-floor-a"]; C.floorB = C["--zw-floor-b"];
    C.wood = C["--zw-wood"]; C.woodDark = C["--zw-wood-dark"]; C.screenOff = C["--zw-screen-off"];
    C.chair = C["--zw-chair"]; C.text = C["--zw-text"]; C.dim = C["--zw-dim"]; C.border = C["--zw-border"];
    C.accent = C["--zw-accent"]; C.ok = C["--zw-ok"]; C.warn = C["--zw-warn"]; C.bad = C["--zw-bad"];
  }
  resolveColors();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", resolveColors);
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", resolveColors);

  var agents = ROSTER.map(function (r, i) {
    return Object.assign({}, r, { idx: i, deskX: 0, x: -60, state: "absent", bubble: "", last: "—", blink: Math.random() * 3, workStart: 0, idleMode: null, idleNext: 0, idleStart: 0, idleDur: 0, phase: null, wy: 0, wtarget: 0, keys: [] });
  });
  var selected = null;

  var W = 600, H = 520, floorY = 470, deskY = 420, dpr = 1, PS = 1;
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = scene.clientWidth - 2;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = agents.length, m = 30;
    PS = Math.max(0.75, Math.min(1.8, ((W - 60) / n - 16) / 104));
    agents.forEach(function (a, i) { a.deskX = Math.round(m + ((W - m * 2) / n) * (i + 0.5)); });
    if (reduceMotion) drawStatic();
  }

  var tagEls = [], bubbleEls = [];
  agents.forEach(function (a, i) {
    var t = document.createElement("div");
    t.className = "zw-tag";
    t.style.top = (floorY + 8) + "px";
    t.innerHTML = '<span class="zw-sdot"></span>' + a.name;
    scene.appendChild(t); tagEls.push(t);
    var b = document.createElement("div");
    b.className = "zw-bubble"; b.style.display = "none";
    scene.appendChild(b); bubbleEls.push(b);
  });

  /* ---------------- live engine ---------------- */
  var sim = { t: 0, tokens: 0, shownTok: 0, rate: 0, active: false, wallet: 0, logRows: [], lastActor: null, source: "connecting", pos: 0 };

  function normAgent(type) {
    var t = String(type || "").toLowerCase();
    for (var i = 1; i < agents.length; i++) {
      var k = agents[i].key;
      if (t.indexOf(k) >= 0) return agents[i];
    }
    if (t.indexOf("purpose") >= 0 || t.indexOf("general") >= 0) return agents[2];
    if (t.indexOf("flow") >= 0) return agents[3];
    if (t.indexOf("judge") >= 0) return agents[4];
    if (t.indexOf("explore") >= 0 || t.indexOf("search") >= 0) return agents[1];
    // unknown subagent type: first free desk, renamed
    for (var j = 1; j < agents.length; j++) {
      if (agents[j].state === "absent") {
        var name = String(type || "visitor").split(/[:_-]/)[0].slice(0, 10);
        agents[j].key = "dyn:" + name;
        agents[j].name = name;
        agents[j].role = "子代理 · " + String(type || "").slice(0, 40);
        agents[j].scarf = SCARFS[j % SCARFS.length];
        tagEls[j].innerHTML = '<span class="zw-sdot"></span>' + name;
        return agents[j];
      }
    }
    return null;
  }
  function agentByKey(key) {
    if (!key || key === "main") return agents[0];
    var a = normAgent(key);
    return a || null;
  }

  var logBox = document.getElementById("zw-panel-log");
  function fmtT(ts) {
    try { var d = new Date(ts); return d.toTimeString().slice(0, 8); } catch (e) { return ""; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function addLog(a, tool, st, txt, ts) {
    sim.logRows.push({ a: a, tool: tool, st: st, txt: txt, ts: ts || Date.now() });
    var rows = sim.logRows.slice(-60);
    var html = "";
    if (sim.logRows.length > 9) html += '<div class="zw-more">…更早 ' + (sim.logRows.length - 9) + ' 条</div>';
    rows.slice(-9).forEach(function (ev, i, arr) {
      var isLast = i === arr.length - 1;
      var badge = ev.st === "run" && isLast && !sim.liveIdle ? '<span class="zw-badge run">进行中</span>' :
        ev.st === "fail" ? '<span class="zw-badge bad">失败</span>' :
        ev.st === "warn" ? '<span class="zw-badge warn">改道</span>' : '<span class="zw-badge ok">完成</span>';
      html += '<div class="zw-row"><span class="zw-t">' + fmtT(ev.ts) + '</span><span class="zw-agent">' + esc(ev.a) + '</span>' + badge +
        '<span class="zw-txt">' + esc(ev.tool + " · " + ev.txt) + '</span></div>';
    });
    logBox.innerHTML = html;
  }

  var chatBox = document.getElementById("zw-chatlog");
  function addChat(role, txt) {
    var d = document.createElement("div");
    d.className = "zw-msg " + role;
    d.textContent = txt;
    chatBox.appendChild(d);
    while (chatBox.children.length > 8) chatBox.removeChild(chatBox.firstChild);
  }

  var detail = document.getElementById("zw-detail");
  var ST_TXT = { absent: "不在工位", walkin: "正在入位", standby: "待机", working: "工作中", high: "高压运转", coffee: "咖啡休息" };
  function updateDetail() {
    if (!selected) { detail.textContent = "点击任意小马查看分工与最近动作。"; return; }
    detail.innerHTML = "<b>" + esc(selected.name) + "</b> · " + esc(selected.role) + " · 状态:<b>" + ST_TXT[selected.state] + "</b> · 最近:" + esc(selected.last);
  }

  function setLive(txt, busy) {
    document.getElementById("zw-live-txt").textContent = txt;
    document.getElementById("zw-live").className = "zw-chip" + (busy ? " live" : "");
  }

  function handleEvent(ev) {
    var now = Date.now();
    if (ev.ev === "session") {
      addLog("ZCode", "SessionStart", "ok", "会话启动 (" + (ev.text || "startup") + ")", ev.ts);
      return;
    }
    if (ev.ev === "prompt") {
      var m = agents[0];
      m.state = m.state === "absent" ? "walkin" : "working";
      m.walkT = 0; if (m.state === "walkin") m.x = -60;
      m.workStart = now;
      m.bubble = ev.text || "处理请求"; m.last = m.bubble;
      sim.lastActor = m;
      addLog("ZCode", "Prompt", "run", ev.text || "(空)", ev.ts);
      addChat("u", ev.text || "");
      return;
    }
    if (ev.ev === "agent_start") {
      var a = agentByKey(ev.agent);
      if (a) {
        if (a.state === "absent") { a.state = "walkin"; a.x = -60; a.walkT = 0; }
        else a.state = "working";
        a.workStart = now;
        a.bubble = ev.text ? "领任务: " + ev.text : "开始工作"; a.last = a.bubble;
        sim.lastActor = a;
        addLog(a.name, "Agent", "run", ev.text ? "启动子代理 · " + ev.text : "启动子代理", ev.ts);
      }
      return;
    }
    if (ev.ev === "tool") {
      var main = agents[0];
      main.state = "working"; main.workStart = now;
      main.bubble = (ev.tool || "Tool") + " · " + (ev.text || "");
      main.last = main.bubble;
      sim.lastActor = main;
      addLog("ZCode", ev.tool || "Tool", ev.status === "fail" ? "fail" : "ok", ev.text || "", ev.ts);
      return;
    }
    if (ev.ev === "agent_end") {
      var b = agentByKey(ev.agent);
      if (b) {
        b.state = Math.random() < 0.25 ? "coffee" : "standby";
        b.bubble = b.state === "coffee" ? "☕ 咖啡配额 +1" : "任务完成,交还主编排";
        b.last = ev.text || "子代理返回";
        sim.lastActor = b;
        addLog(b.name, "Agent", "ok", ev.text ? "返回 · " + ev.text : "子代理返回", ev.ts);
      }
      return;
    }
    if (ev.ev === "turn_end") {
      var mm = agents[0];
      mm.state = Math.random() < 0.35 ? "coffee" : "standby";
      mm.bubble = mm.state === "coffee" ? "☕ 咖啡配额 +1" : "收工,等待下一个任务";
      mm.last = "回合结束";
      sim.lastActor = mm;
      addLog("ZCode", "Stop", "ok", "回合结束,等待输入", ev.ts);
      return;
    }
  }

  /* ---------------- polling ---------------- */
  var demoPlayed = false;
  function poll() {
    fetch("/events?since=" + sim.pos, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {

    } catch (e) { window.__errs.push(String(e)); }
    requestAnimationFrame(frame);
  }
  function drawStatic() {
    agents.forEach(function (a) { if (a.state === "walkin") { a.state = "standby"; a.x = a.deskX; } });
    drawScene(sim.t); syncOverlays();
  }
  setInterval(function () {
    if (reduceMotion) return;
    try { tickAndDraw(0.25); } catch (e) {}
  }, 400);

  canvas.addEventListener("click", function (e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var best = null, bd = 1e9;
    agents.forEach(function (a) {
      if (a.state === "absent") return;
      var d = Math.abs(mx - a.x);
      if (d < bd) { bd = d; best = a; }
    });
    selected = best && bd < 44 ? best : null;
    updateDetail();
  });
  document.getElementById("zw-tab-log").onclick = function () { setTab(true); };
  document.getElementById("zw-tab-art").onclick = function () { setTab(false); };
  function setTab(logActive) {
    document.getElementById("zw-tab-log").setAttribute("aria-selected", logActive);
    document.getElementById("zw-tab-art").setAttribute("aria-selected", !logActive);
    document.getElementById("zw-panel-log").hidden = !logActive;
    document.getElementById("zw-panel-art").hidden = logActive;
  }

  layout();
  new ResizeObserver(function () { layout(); }).observe(scene);
  updateDetail();
  if (reduceMotion) { drawStatic(); setInterval(function () { poll(); }, 3000); }
  else requestAnimationFrame(function (ts) { lastTs = ts; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
